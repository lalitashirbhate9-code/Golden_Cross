name: Update NSE golden-cross data

on:
  schedule:
    - cron: "00 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run scanner
        run: python scripts/update_dashboard.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse_golden_cross.json data/history.json data/report.json data/stock_history.csv
          git diff --cached --quiet || git commit -m "chore: update NSE golden-cross data"
          git push
